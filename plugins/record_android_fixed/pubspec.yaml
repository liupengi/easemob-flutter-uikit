name: record_android
description: Android implementation of record package
version: 1.4.0
homepage: https://github.com/llfbandit/record

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.3.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.llfbandit.record
        pluginClass: RecordPlugin

dependencies:
  flutter:
    sdk: flutter
  record_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0